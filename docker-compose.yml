services:
  postgres:
    image: postgres:16-alpine
    container_name: asun-migrations-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asun
      POSTGRES_PASSWORD: asun_password
      POSTGRES_DB: asun_migrations
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asun -d asun_migrations"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

